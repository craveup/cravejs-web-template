name: Publish immutable web template

# The release token is never present while third-party code runs. Installing
# dependencies and assembling the artifact happen in a read-only job; only the
# tag and release mutation runs with `contents: write`, and even there the token
# is scoped to that single step.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact 40-character commit currently at the tip of main
        required: true
        type: string
      evidence_url:
        description: HTTPS URL with exact-head approval and release evidence
        required: true
        type: string
      confirm_repository:
        description: Type craveup/cravejs-web-template to authorize publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: immutable-web-template-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EVIDENCE_URL: ${{ inputs.evidence_url }}
      CONFIRM_REPOSITORY: ${{ inputs.confirm_repository }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      artifact_sha256: ${{ steps.release.outputs.artifact_sha256 }}
      manifest_sha256: ${{ steps.release.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_commit }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate exact public mirror head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "craveup/cravejs-web-template"
          test "$CONFIRM_REPOSITORY" = "$GITHUB_REPOSITORY"
          printf '%s' "$EXPECTED_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EVIDENCE_URL" | grep -Eq '^https://[^[:space:]]+$'
          test "$GITHUB_REF_NAME" = "main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$EXPECTED_COMMIT"
          test "$(jq -r .publicRepository .crave/source.json)" = "$GITHUB_REPOSITORY"
          jq -e '.sourceCommit | test("^[0-9a-f]{40}$")' .crave/source.json >/dev/null

      - name: Require protected public-release settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-public-release-settings.mjs

      # Everything below this line may execute third-party code. No token is in
      # scope for any of it.
      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      - name: Assemble and verify exact release assets
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(jq -r .template.minimumVersion template/release/compatibility.json)"
          released_at="$(node -e 'process.stdout.write(new Date(process.argv[1]).toISOString())' "$(git show -s --format=%cI HEAD)")"
          output_directory="$RUNNER_TEMP/web-template-release"
          node scripts/assemble-template-release.mjs \
            --release "$release_version" \
            --released-at "$released_at" \
            --output "$output_directory"
          artifact_name="cravejs-web-template-$release_version.tar"
          artifact="$output_directory/$artifact_name"
          manifest="$output_directory/template-release.json"
          node scripts/validate-template-release.mjs "$manifest"
          node --input-type=module -e '
            import { verifyDistributionBoundary } from "./scripts/verify-distribution-boundary.mjs";
            const result = verifyDistributionBoundary(process.argv[1], "distribution/asset-ownership.json");
            console.log(`distribution boundary verified across ${result.members} members`);
          ' "$artifact"
          test "$(jq -r .repository "$manifest")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .templateCommit "$manifest")" = "$EXPECTED_COMMIT"
          printf 'version=%s\ntag=v%s\nartifact_name=%s\nartifact_sha256=%s\nmanifest_sha256=%s\n' \
            "$release_version" \
            "$release_version" \
            "$artifact_name" \
            "$(sha256sum "$artifact" | cut -d ' ' -f 1)" \
            "$(sha256sum "$manifest" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-template-release-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/web-template-release
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: public-release
    permissions:
      contents: write
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EVIDENCE_URL: ${{ inputs.evidence_url }}
      TAG: ${{ needs.verify.outputs.tag }}
      ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_commit }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-template-release-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/release

      - name: Verify transferred release assets
        shell: bash
        env:
          EXPECTED_ARTIFACT_SHA256: ${{ needs.verify.outputs.artifact_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/release/$ARTIFACT_NAME"
          manifest="$RUNNER_TEMP/release/template-release.json"
          test "$(sha256sum "$artifact" | cut -d ' ' -f 1)" = "$EXPECTED_ARTIFACT_SHA256"
          test "$(sha256sum "$manifest" | cut -d ' ' -f 1)" = "$EXPECTED_MANIFEST_SHA256"
          test "$(jq -r .templateCommit "$manifest")" = "$EXPECTED_COMMIT"

      - name: Recheck main and create the immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/release/$ARTIFACT_NAME"
          manifest="$RUNNER_TEMP/release/template-release.json"
          test -f "$artifact"
          test -f "$manifest"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$EXPECTED_COMMIT"
          repository="$GITHUB_REPOSITORY"
          if tag_ref="$(gh api "repos/$repository/git/ref/tags/$TAG" 2>/dev/null)"; then
            object_sha="$(jq -r .object.sha <<<"$tag_ref")"
            object_type="$(jq -r .object.type <<<"$tag_ref")"
            if [ "$object_type" = "tag" ]; then
              target_sha="$(gh api "repos/$repository/git/tags/$object_sha" --jq .object.sha)"
            else
              target_sha="$object_sha"
            fi
            test "$target_sha" = "$EXPECTED_COMMIT"
          else
            tag_object_sha="$(
              jq -n \
                --arg tag "$TAG" \
                --arg message "Crave.js web template $TAG" \
                --arg object "$EXPECTED_COMMIT" \
                '{tag:$tag,message:$message,object:$object,type:"commit"}' |
                gh api --method POST "repos/$repository/git/tags" --input - --jq .sha
            )"
            jq -n \
              --arg ref "refs/tags/$TAG" \
              --arg sha "$tag_object_sha" \
              '{ref:$ref,sha:$sha}' |
              gh api --method POST "repos/$repository/git/refs" --input - >/dev/null
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          source_repository="$(jq -r .sourceRepository .crave/source.json)"
          source_commit="$(jq -r .sourceCommit .crave/source.json)"
          printf '# Crave.js web template %s\n\n- Public commit: `%s`\n- Private source provenance: `%s@%s`\n- Evidence: %s\n' \
            "$TAG" "$EXPECTED_COMMIT" "$source_repository" "$source_commit" "$EVIDENCE_URL" > "$notes"
          if release="$(gh api "repos/$repository/releases/tags/$TAG" 2>/dev/null)"; then
            test "$(jq -r .draft <<<"$release")" = "true"
            gh release upload "$TAG" \
              "$artifact#Canonical web CLI payload" \
              "$manifest#Release manifest" \
              --repo "$repository" \
              --clobber
            gh release edit "$TAG" \
              --repo "$repository" \
              --title "$TAG" \
              --notes-file "$notes"
          else
            gh release create "$TAG" \
              "$artifact#Canonical web CLI payload" \
              "$manifest#Release manifest" \
              --repo "$repository" \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --notes-file "$notes"
          fi
          gh release edit "$TAG" --repo "$repository" --draft=false --verify-tag
          gh release verify "$TAG" --repo "$repository"
          gh release verify-asset "$TAG" "$artifact" --repo "$repository"
          gh release verify-asset "$TAG" "$manifest" --repo "$repository"
